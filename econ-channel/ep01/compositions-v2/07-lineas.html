<template>
  <style>
    @font-face { font-family: "Anton"; src: url("./assets/fonts/anton-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "Archivo Black"; src: url("./assets/fonts/archivo-black-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "Archivo"; src: url("./assets/fonts/archivo-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "Archivo"; src: url("./assets/fonts/archivo-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }
    :root { --board:#10312B; --board2:#0B241F; --chalk:#EDE6D3; --yellow:#FFD84D; --coral:#FF6B57; --mut:rgba(237,230,211,.55); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    #root { position: absolute; inset: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; text-align: center;
      background: radial-gradient(ellipse 1500px 950px at 50% 44%, #16382F 0%, var(--board) 55%, var(--board2) 100%);
      font-family: "Archivo", "Liberation Sans", sans-serif; color: var(--chalk); }
    .stack { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; position: relative; width: 1700px; }
    .chart-title { display: flex; justify-content: space-between; width: 100%; padding: 0 8px; }
    .chart-title .t { font-weight: 700; font-size: 16px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--mut); }
    .legend { display: flex; gap: 22px; }
    .lg { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; letter-spacing: 0.1em; }
    .lg .sw { width: 30px; height: 6px; border-radius: 3px; } .lg .sw.us { background: var(--yellow); } .lg .sw.ea { background: var(--chalk); }
    .peak { position: absolute; font-family: "Anton"; font-size: 42px; color: var(--coral); line-height: 1; text-align: center; }
    .peak small { display: block; font-family: "Archivo"; font-weight: 700; font-size: 13px; letter-spacing: 0.22em; color: var(--mut); margin-top: 6px; }
  </style>
  <div id="root" data-composition-id="s07" data-width="1920" data-height="1080">
    <div class="stack">
      <div class="chart-title" id="s07-title">
        <div class="t">IPC interanual · dic, 2016–2026</div>
        <div class="legend"><div class="lg"><span class="sw us"></span>EE. UU.</div><div class="lg"><span class="sw ea"></span>Zona euro</div></div>
      </div>
      <div class="chart-wrap" id="s07-chart" style="position:relative; width:1660px;">
        <svg id="s07-svg" width="1660" height="560" viewBox="0 0 1660 560"></svg>
        <div class="peak" id="s07-peak-us" style="left: 845px; top: -8px;">9,1%<small>JUN-2022</small></div>
        <div class="peak" id="s07-peak-ea" style="left: 880px; top: 80px;">10,6%<small>OCT-2022</small></div>
      </div>
    </div>
    <audio id="s07-vo" data-start="0.15" data-duration="11.350" data-track-index="9" src="./assets/voice-v2/07.mp3"></audio>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const US = [2.1, 2.1, 2.0, 2.3, 1.3, 7.2, 6.4, 3.3, 2.9, 2.7, 3.7];
    const EA = [1.1, 1.4, 1.6, 1.3, -0.3, 5.0, 9.2, 2.9, 2.4, 2.0, 4.0];
    const YEARS = [2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026];
    const W = 1660, H = 560, L = 70, R = 26, T = 30, B = 46;
    const iW = W - L - R, iH = H - T - B, yMin = -1, yMax = 12;
    const X = i => L + i * (iW / (YEARS.length - 1));
    const Y = v => T + (yMax - v) * (iH / (yMax - yMin));
    const line = arr => arr.map((v, i) => (i ? "L" : "M") + X(i).toFixed(1) + "," + Y(v).toFixed(1)).join(" ");
    let g = "";
    [0, 3, 6, 9, 12].forEach(v => {
      g += `<line x1="${L}" y1="${Y(v)}" x2="${W - R}" y2="${Y(v)}" stroke="#EDE6D3" stroke-opacity="${v === 0 ? 0.4 : 0.12}" stroke-width="2"/>`;
      g += `<text x="${L - 14}" y="${Y(v) + 6}" text-anchor="end" fill="#EDE6D3" fill-opacity="0.55" font-size="17" font-family="Archivo">${v}%</text>`;
    });
    YEARS.forEach((y, i) => { if (i % 2 === 0) g += `<text x="${X(i)}" y="${H - 10}" text-anchor="middle" fill="#EDE6D3" fill-opacity="0.55" font-size="18" font-family="Archivo">${y}</text>`; });
    g += `<path id="s07-line-us" d="${line(US)}" fill="none" stroke="#FFD84D" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>`;
    g += `<path id="s07-line-ea" d="${line(EA)}" fill="none" stroke="#EDE6D3" stroke-width="5" stroke-dasharray="2 14" stroke-linecap="round" stroke-linejoin="round"/>`;
    document.getElementById("s07-svg").innerHTML = g;
    tl.fromTo("#s07-title", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 0.1);
    tl.fromTo("#s07-chart", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.3);
    const us = document.getElementById("s07-line-us"); const len = us.getTotalLength();
    us.style.strokeDasharray = len; us.style.strokeDashoffset = len;
    tl.to(us, { strokeDashoffset: 0, duration: 2.2, ease: "power2.inOut" }, 0.8);
    tl.fromTo("#s07-line-ea", { opacity: 0 }, { opacity: 1, duration: 1.4 }, 1.6);
    tl.fromTo("#s07-peak-us", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 4.4);
    tl.fromTo("#s07-peak-ea", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 5.3);
    window.__timelines["s07"] = tl;
  </script>
</template>
