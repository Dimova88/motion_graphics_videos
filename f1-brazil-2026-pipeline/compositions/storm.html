<template>
  <style>
    @font-face { font-family: "Anton"; src: url("./assets/fonts/anton-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "Archivo Black"; src: url("./assets/fonts/archivo-black-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "Archivo"; src: url("./assets/fonts/archivo-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "Archivo"; src: url("./assets/fonts/archivo-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }
    @font-face { font-family: "Archivo"; src: url("./assets/fonts/archivo-latin-800-normal.woff2") format("woff2"); font-weight: 800; font-style: normal; font-display: swap; }
    @font-face { font-family: "Archivo"; src: url("./assets/fonts/archivo-latin-900-normal.woff2") format("woff2"); font-weight: 900; font-style: normal; font-display: swap; }
    :root {
      --asphalt: #0b0c0f; --ink: #f4f4f0; --muted: #9a9aa2;
      --yellow: #ffdf00; --prism-r: #ff2a4d; --prism-b: #2a7fff;
      --display: "Anton", "Archivo Black", sans-serif;
      --body: "Archivo", "Liberation Sans", "DejaVu Sans", sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* THE CENTERED STAGE — every scene element lives on the dead centre of 1920x1080 */
    #root {
      position: absolute; inset: 0; overflow: hidden;
      display: flex; align-items: center; justify-content: center; text-align: center;
      background: radial-gradient(ellipse 1500px 950px at 50% 50%, #151c30 0%, #0b0c0f 72%);
      font-family: var(--body); color: var(--ink);
    }
    .halo { position: absolute; width: 940px; height: 940px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.07); }
    .stack { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; position: relative; }
    .kicker { font-weight: 800; font-size: 16px; letter-spacing: 0.34em; color: var(--yellow); text-transform: uppercase; }
    .sub { font-size: 17px; font-weight: 700; letter-spacing: 0.2em; color: #c6c6cd; text-transform: uppercase; }

    /* prism title (yt-prism-title technique) */
    .prism { position: relative; display: inline-block; line-height: 0.92; }
    .prism .copy { position: absolute; inset: 0; pointer-events: none; }
    .prism .copy.r { color: var(--prism-r); transform: translateX(-5px); opacity: .92; }
    .prism .copy.b { color: var(--prism-b); transform: translateX(5px); opacity: .92; }
    .prism .main { position: relative; }
    h1.title { font-family: var(--display); font-weight: 400; font-style: italic; font-size: 168px; letter-spacing: -0.02em; text-transform: uppercase; color: #fff; text-shadow: 0 12px 70px rgba(0,0,0,0.6); }

    /* rain */
    .rain { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .rain i { position: absolute; top: -200px; width: 3px; border-radius: 3px; background: linear-gradient(180deg, rgba(200,225,255,0) 0%, rgba(200,225,255,0.8) 55%, rgba(200,225,255,0) 100%); animation: fall 1.05s linear infinite; }
    @keyframes fall { from { transform: translateY(-40px); } to { transform: translateY(1400px); } }
  </style>
  <div id="root" data-composition-id="storm" data-width="1920" data-height="1080">
    <div class="halo"></div>
    <div class="rain" id="storm-rain"></div>
    <div class="stack">
      <div class="kicker" id="storm-kicker">F1 · São Paulo · Interlagos</div>
      <h1 class="title"><span class="prism" id="storm-prism"><span class="copy r">THE STORM</span><span class="copy b">THE STORM</span><span class="main">THE STORM</span></span></h1>
      <div class="sub" id="storm-sub">Round 21 · November 8 · Everything was written before lights out</div>
    </div>
    <audio id="storm-vo" data-start="0.35" data-duration="3.09" data-track-index="9" data-playback-rate="1.15" src="./assets/voice/p1.mp3"></audio>
  </div>
  <script>
    // deterministic rain streaks, dead-centre composition kept intact
    (() => {
      const rain = document.getElementById("storm-rain");
      let html = "";
      for (let i = 0; i < 34; i++) {
        const left = (i * 173) % 100;
        const h = 70 + ((i * 97) % 120);
        const delay = -((i * 0.137) % 1.05).toFixed(3);
        html += '<i style="left:' + left + '%;height:' + h + 'px;animation-delay:' + delay + 's;opacity:' + (0.35 + (i % 5) * 0.12).toFixed(2) + '"></i>';
      }
      rain.innerHTML = html;
    })();

    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#storm-kicker", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.25);
    tl.fromTo("#storm-prism .main", { opacity: 0, filter: "blur(20px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.85, ease: "power2.out" }, 0.45);
    tl.fromTo("#storm-prism .copy.r", { opacity: 0, x: -24 }, { opacity: 0.92, x: -5, duration: 0.85, ease: "power2.out" }, 0.45);
    tl.fromTo("#storm-prism .copy.b", { opacity: 0, x: 24 }, { opacity: 0.92, x: 5, duration: 0.85, ease: "power2.out" }, 0.45);
    tl.to("#storm-prism .main", { scale: 1.025, duration: 3.4, ease: "sine.inOut" }, 1.1);
    tl.fromTo("#storm-sub", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.15);
    tl.fromTo(".halo", { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 1.4, ease: "power2.out" }, 0.2);
    window.__timelines["storm"] = tl;
  </script>
</template>
