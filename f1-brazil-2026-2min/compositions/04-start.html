<template>
  <style>
    @font-face { font-family: "Anton"; src: url("./assets/fonts/anton-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "Archivo Black"; src: url("./assets/fonts/archivo-black-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "Archivo"; src: url("./assets/fonts/archivo-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "Archivo"; src: url("./assets/fonts/archivo-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }
    @font-face { font-family: "Archivo"; src: url("./assets/fonts/archivo-latin-800-normal.woff2") format("woff2"); font-weight: 800; font-style: normal; font-display: swap; }
    @font-face { font-family: "Archivo"; src: url("./assets/fonts/archivo-latin-900-normal.woff2") format("woff2"); font-weight: 900; font-style: normal; font-display: swap; }
    :root {
      --asphalt: #0b0c0f; --ink: #f4f4f0; --muted: #9a9aa2; --yellow: #ffdf00; --mercedes: #27f4d2; --papaya: #ff8000;
      --prism-r: #ff2a4d; --prism-b: #2a7fff;

      --body: "Archivo", "Liberation Sans", "DejaVu Sans", sans-serif;

    #root {
      position: absolute; inset: 0; overflow: hidden;
      display: flex; align-items: center; justify-content: center; text-align: center;
      background: radial-gradient(ellipse 1300px 850px at 50% 50%, rgba(255,223,0,0.09) 0%, #0b0c0f 70%);
      font-family: var(--body); color: var(--ink);
    }
    .stack { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; position: relative; }
    .kicker { font-weight: 800; font-size: 16px; letter-spacing: 0.34em; color: var(--yellow); text-transform: uppercase; }

    h1.title { font-family: var(--display); font-weight: 400; font-style: italic; font-size: 146px; line-height: 0.92; letter-spacing: -0.02em; text-transform: uppercase; color: #fff; text-shadow: 0 12px 70px rgba(0,0,0,0.6); }

    .prism .copy.b { color: var(--prism-b); transform: translateX(6px); opacity: .92; }

  <div id="root" data-composition-id="start" data-width="1920" data-height="1080">
    <div class="stack">
      <div class="kicker" id="start-kicker">The Start — 14:00 Local</div>
      <h1 class="title"><span class="prism" id="start-prism"><span class="copy r">LIGHTS OUT</span><span class="copy b">LIGHTS OUT</span><span class="main">LIGHTS OUT</span></span></h1>
      <div class="lights" id="start-row">
        <div class="light" id="start-l1"></div>
        <div class="light" id="start-l2"></div>
        <div class="light" id="start-l3"></div>
        <div class="light" id="start-l4"></div>
        <div class="light" id="start-l5"></div>
      </div>
      <div class="t1" id="start-t1">
        <div class="t1-tag">Turn One — Antonelli Leads</div>

        <div class="num" id="start-counter">0</div>
        <div class="cap">Laps</div>

      <div class="checker" id="start-checker"></div>
    </div>
    <audio id="start-vo" data-start="0.5" data-duration="6.14" data-track-index="9" data-playback-rate="1.15" src="./assets/voice/p4.mp3"></audio>
    <audio id="start-lights" data-start="0.3" data-duration="2.7" data-track-index="8" data-volume="0.9" src="./assets/sfx/lights.wav"></audio>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#start-kicker", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.15);
    tl.fromTo("#start-prism .main", { opacity: 0, scale: 0.92, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "power4.out" }, 0.3);
    tl.fromTo("#start-prism .copy.r", { opacity: 0, x: -20 }, { opacity: 0.92, x: -6, duration: 0.6, ease: "power4.out" }, 0.3);
    tl.fromTo("#start-prism .copy.b", { opacity: 0, x: 20 }, { opacity: 0.92, x: 6, duration: 0.6, ease: "power4.out" }, 0.3);
    tl.fromTo("#start-row", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.55);
    // five out in sequence — the race begins (synced to the blips in lights.wav)
    ["#start-l1","#start-l2","#start-l3","#start-l4","#start-l5"].forEach((sel, i) => {
      tl.to(sel, { backgroundColor: "#20222a", boxShadow: "none", duration: 0.08 }, 0.35 + i * 0.34);
    });
    tl.fromTo("#start-t1", { opacity: 0, scale: 0.7, y: 12 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.7)" }, 3.6);
    const counter = { v: 0 };
    tl.to(counter, { v: 71, duration: 2.1, ease: "power2.inOut", onUpdate: () => { document.getElementById("start-counter").textContent = Math.round(counter.v); } }, 2.6);
    tl.fromTo("#start-checker", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.9);
    window.__timelines["start"] = tl;
  </script>
