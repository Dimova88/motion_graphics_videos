          <svg class="tire dim" viewBox="0 0 120 120" role="img" aria-label="Verstappen, Red Bull, slot 21">

              <radialGradient id="rub-c-dim" cx="42%" cy="36%" r="72%"><stop offset="0%" stop-color="#2b2b30"/><stop offset="55%" stop-color="#17171b"/><stop offset="100%" stop-color="#060608"/></radialGradient>
              <radialGradient id="rim-c-dim" cx="38%" cy="30%" r="78%"><stop offset="0%" stop-color="#639ae0"/><stop offset="55%" stop-color="#3671c6"/><stop offset="100%" stop-color="#1c4c88"/></radialGradient>

            <text x="60" y="68" text-anchor="middle" font-family="Anton, 'Archivo Black', sans-serif" font-weight="400" font-style="italic" font-size="24" letter-spacing="1.5" fill="#f2f7ff">VER</text>

              <radialGradient id="rim-c-bright" cx="38%" cy="30%" r="78%"><stop offset="0%" stop-color="#639ae0"/><stop offset="55%" stop-color="#3671c6"/><stop offset="100%" stop-color="#1c4c88"/></radialGradient>

    <audio id="climb-vo-b" data-start="9.0" data-duration="2.82" data-track-index="9" data-playback-rate="1.15" src="./assets/voice/p5.mp3"></audio>

  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#climb-kicker", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.15);
    tl.fromTo("#climb-start", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, 0.5);
    tl.set("#climb-end", { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, 0);
    tl.fromTo("#climb-track", { opacity: 0, scaleX: 0.6 }, { opacity: 1, scaleX: 1, duration: 0.6, ease: "power2.out", transformOrigin: "50% 50%" }, 1.2);

    const arrowPath = document.getElementById("climb-arrow-path");
    const len = arrowPath.getTotalLength();
    gsap.set(arrowPath, { strokeDasharray: len, strokeDashoffset: len });
    gsap.set("#climb-arrow-head", { opacity: 0 });

    // the whole charge happens across the stint
    tl.to(arrowPath, { strokeDashoffset: 0, duration: 3.2, ease: "power2.inOut" }, 3.0);
    tl.to("#climb-arrow-head", { opacity: 1, duration: 0.35, ease: "power2.out" }, 5.9);
    const charge = { v: 0 };
    tl.to(charge, { v: 19, duration: 12.5, ease: "power2.inOut", onUpdate: () => { document.getElementById("climb-places").textContent = "+" + Math.round(charge.v); } }, 2.0);
    tl.to("#climb-fill", { width: "96.5%", duration: 12.5, ease: "power2.inOut" }, 2.0);

    tl.to("#climb-end", { opacity: 1, scale: 1, duration: 0.85, ease: "back.out(1.7)" }, 6.2);
    tl.to("#climb-start", { opacity: 0.35, duration: 0.8 }, 6.2);
    tl.fromTo("#climb-gap", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 8.6);
    window.__timelines["climb"] = tl;
  </script>
