<template>
  <style>
    @font-face { font-family: "Anton"; src: url("./assets/fonts/anton-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "Archivo Black"; src: url("./assets/fonts/archivo-black-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "Archivo"; src: url("./assets/fonts/archivo-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "Archivo"; src: url("./assets/fonts/archivo-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }
    @font-face { font-family: "Archivo"; src: url("./assets/fonts/archivo-latin-800-normal.woff2") format("woff2"); font-weight: 800; font-style: normal; font-display: swap; }
    @font-face { font-family: "Archivo"; src: url("./assets/fonts/archivo-latin-900-normal.woff2") format("woff2"); font-weight: 900; font-style: normal; font-display: swap; }
    :root {
      --asphalt: #0b0c0f; --ink: #f4f4f0; --muted: #9a9aa2; --yellow: #ffdf00;
      --papaya: #ff8000; --mercedes: #27f4d2; --redbull: #3671c6;
      --display: "Anton", "Archivo Black", sans-serif;
      --body: "Archivo", "Liberation Sans", "DejaVu Sans", sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    #root {
      position: absolute; inset: 0; overflow: hidden;
      display: flex; align-items: center; justify-content: center; text-align: center;
      background: radial-gradient(ellipse 1400px 950px at 50% 50%, #10131c 0%, #0b0c0f 74%);
      font-family: var(--body); color: var(--ink);
    }
    .stack { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; width: 100%; position: relative; }
    .kicker { font-weight: 800; font-size: 16px; letter-spacing: 0.34em; color: var(--yellow); text-transform: uppercase; }

    .board { display: flex; flex-direction: column; gap: 14px; width: 980px; }
    .rowx {
      display: grid; grid-template-columns: 66px 108px 1fr 150px; align-items: center; gap: 22px;
      background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 10px 26px 10px 18px; position: relative; overflow: hidden;
      text-align: left;
    }
    .rowx.ant { border-color: rgba(39,244,210,0.35); background: rgba(39,244,210,0.06); }
    .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; }
    .pos { font-family: var(--display); font-size: 38px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; }
    .rowx.ant .pos { color: var(--mercedes); }
    .cell { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .tire { width: 84px; height: 84px; display: block; }
    .name { font-family: var(--display); font-style: italic; font-size: 30px; letter-spacing: 0.03em; line-height: 1; text-align: left; }
    .team { font-size: 12px; font-weight: 800; letter-spacing: 0.26em; color: var(--muted); text-transform: uppercase; text-align: left; }
    .gap { font-size: 19px; font-weight: 700; color: #e8e8de; font-variant-numeric: tabular-nums; text-align: right; letter-spacing: 0.02em; }
    .pen { display: inline-block; margin-left: 8px; border: 1px solid rgba(255,109,90,0.6); color: #ff8d7a; font-size: 11px; font-weight: 800; letter-spacing: 0.2em; padding: 2px 8px 3px; border-radius: 4px; vertical-align: 2px; }
  </style>
  <div id="root" data-composition-id="result" data-width="1920" data-height="1080">
    <div class="stack">
      <div class="kicker" id="res-kicker">Final Classification — Top 6</div>
      <div class="board" id="res-board"></div>
    </div>
    <audio id="result-crowd" data-start="0.0" data-duration="12.0" data-track-index="8" data-volume="0.25" src="./assets/sfx/crowd.wav"></audio>
  </div>
  <script>
    const drivers = [
      { pos: 1, code: "NOR", name: "NORRIS",  team: "McLaren",  teamColor: "#ff8000", gap: "—",          dim: false },
      { pos: 2, code: "VER", name: "VERSTAPPEN", team: "Red Bull", teamColor: "#3671c6", gap: "+14.602",   dim: false },
      { pos: 3, code: "HAD", name: "HADJAR",   team: "Red Bull", teamColor: "#3671c6", gap: "+24.485",   dim: false },
      { pos: 4, code: "RUS", name: "RUSSELL",  team: "Mercedes", teamColor: "#27f4d2", gap: "+33.991",   dim: false },
      { pos: 5, code: "ANT", name: "ANTONELLI", team: "Mercedes", teamColor: "#27f4d2", gap: "+41.017",   pen: true, dim: false },
      { pos: 6, code: "PIA", name: "PIASTRI",  team: "McLaren",  teamColor: "#ff8000", gap: "+56.475",   dim: false },
    ];
    const rimLight = { "#ff8000": "#ffb25e", "#3671c6": "#639ae0", "#27f4d2": "#7dfbe4" };
    const rimMid   = { "#ff8000": "#ff8000", "#3671c6": "#3671c6", "#27f4d2": "#27f4d2" };
    const rimDark  = { "#ff8000": "#c75d00", "#3671c6": "#1c4c88", "#27f4d2": "#0e9c80" };
    const textDark = { "#ff8000": "#241000", "#3671c6": "#f2f7ff", "#27f4d2": "#03271d" };

    function tire(code, color, i) {
      return `
        <svg class="tire" viewBox="0 0 120 120" role="img" aria-label="${code}">
          <defs>
            <radialGradient id="rub-r-${i}" cx="42%" cy="36%" r="72%"><stop offset="0%" stop-color="#2b2b30"/><stop offset="55%" stop-color="#17171b"/><stop offset="100%" stop-color="#060608"/></radialGradient>
            <radialGradient id="rim-r-${i}" cx="38%" cy="30%" r="78%"><stop offset="0%" stop-color="${rimLight[color]}"/><stop offset="55%" stop-color="${rimMid[color]}"/><stop offset="100%" stop-color="${rimDark[color]}"/></radialGradient>
          </defs>
          <circle cx="60" cy="60" r="56" fill="url(#rub-r-${i})"/>
          <circle cx="60" cy="60" r="49" fill="none" stroke="#3a3a40" stroke-width="1.3" opacity="0.9"/>
          <circle cx="60" cy="60" r="45.5" fill="none" stroke="rgba(255,255,255,0.17)" stroke-width="9" stroke-dasharray="6.4 8.2"/>
          <circle cx="60" cy="60" r="38.5" fill="none" stroke="${color}" stroke-width="3" opacity="0.95"/>
          <circle cx="60" cy="60" r="31" fill="url(#rim-r-${i})"/>
          <circle cx="60" cy="60" r="31" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="1"/>
          <circle cx="60" cy="60" r="21" fill="none" stroke="rgba(0,0,0,0.28)" stroke-width="1.2"/>
          <ellipse cx="45" cy="31" rx="24" ry="8" fill="#ffffff" opacity="0.20" transform="rotate(-22 45 31)"/>
          <text x="60" y="68" text-anchor="middle" font-family="Anton, 'Archivo Black', sans-serif" font-weight="400" font-style="italic" font-size="24" letter-spacing="1.5" fill="${textDark[color]}">${code}</text>
        </svg>`;
    }

    const board = document.getElementById("res-board");
    board.innerHTML = drivers.map((d, i) => `
      <div class="rowx ${d.code === "ANT" ? "ant" : ""}" id="res-row-${i}">
        <div class="bar" style="background:${d.teamColor}"></div>
        <div class="pos">${d.pos}</div>
        ${tire(d.code, d.teamColor, i)}
        <div>
          <div class="name">${d.name}${d.pen ? '<span class="pen">PEN</span>' : ""}</div>
          <div class="team">${d.team}</div>
        </div>
        <div class="gap">${d.gap}</div>
      </div>
    `).join("");

    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#res-kicker", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.2);
    drivers.forEach((_, i) => {
      tl.fromTo("#res-row-" + i, { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.5 + i * 0.42);
    });
    window.__timelines["result"] = tl;
  </script>
</template>
