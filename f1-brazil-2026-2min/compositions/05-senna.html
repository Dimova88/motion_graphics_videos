<template>
  <style>
    @font-face { font-family: "Anton"; src: url("./assets/fonts/anton-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "Archivo Black"; src: url("./assets/fonts/archivo-black-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "Archivo"; src: url("./assets/fonts/archivo-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "Archivo"; src: url("./assets/fonts/archivo-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }
    @font-face { font-family: "Archivo"; src: url("./assets/fonts/archivo-latin-800-normal.woff2") format("woff2"); font-weight: 800; font-style: normal; font-display: swap; }
    @font-face { font-family: "Archivo"; src: url("./assets/fonts/archivo-latin-900-normal.woff2") format("woff2"); font-weight: 900; font-style: normal; font-display: swap; }
    :root {
      --asphalt: #0b0c0f; --ink: #f4f4f0; --muted: #9a9aa2; --yellow: #ffdf00; --mercedes: #27f4d2; --papaya: #ff8000;
      --display: "Anton", "Archivo Black", sans-serif;
      --body: "Archivo", "Liberation Sans", "DejaVu Sans", sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    #root {
      position: absolute; inset: 0; overflow: hidden;
      display: flex; align-items: center; justify-content: center; text-align: center;
      background: radial-gradient(ellipse 1500px 880px at 50% 46%, #191015 0%, #0b0c0f 74%);
      font-family: var(--body); color: var(--ink);
    }
    .stack { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; position: relative; }
    .kicker { font-weight: 800; font-size: 16px; letter-spacing: 0.34em; color: var(--yellow); text-transform: uppercase; }
    .lap-line { display: flex; align-items: baseline; justify-content: center; gap: 28px; }
    .lap-word { font-family: var(--display); font-style: italic; font-size: 64px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .lap-num { font-family: var(--display); font-style: italic; font-size: 190px; line-height: 0.9; color: #fff; text-shadow: 0 12px 70px rgba(0,0,0,0.6); font-variant-numeric: tabular-nums; }

    .circuit { width: 1180px; height: 300px; overflow: visible; }
    .track-line { stroke: rgba(255,255,255,0.22); stroke-width: 26; fill: none; stroke-linecap: round; }
    .track-core { stroke: #23252c; stroke-width: 22; fill: none; stroke-linecap: round; }
    .circuit .spark { transform-box: fill-box; transform-origin: center; }
    .senna-path { stroke: var(--yellow); stroke-width: 4; fill: none; stroke-dasharray: 10 14; opacity: 0.9; }

    .caption {
      font-size: 21px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;
      border-radius: 999px; padding: 14px 36px;
    }
    #senna-cap-spin { color: #ffd7cd; border: 1px solid rgba(255,109,90,0.6); background: rgba(255,109,90,0.12); }
    #senna-cap-lead { color: #241000; border: 1px solid #ffd34d; background: var(--yellow); }
    .sub { font-size: 15px; font-weight: 700; letter-spacing: 0.26em; color: var(--muted); text-transform: uppercase; }
  </style>
  <div id="root" data-composition-id="senna" data-width="1920" data-height="1080">
    <div class="stack">
      <div class="kicker" id="senna-kicker">Lap Twenty — The Senna S</div>
      <div class="lap-line"><span class="lap-word">Lap</span><span class="lap-num" id="senna-num">20</span></div>

      <svg class="circuit" id="senna-svg" viewBox="0 0 1180 300" role="img" aria-label="The Senna S curve at Interlagos — Antonelli spins, Norris passes">
        <path class="track-line" d="M 80 240 C 330 240, 260 60, 590 60 C 920 60, 850 240, 1100 240"/>
        <path class="track-core" d="M 80 240 C 330 240, 260 60, 590 60 C 920 60, 850 240, 1100 240"/>
        <path class="senna-path" id="senna-path" d="M 80 240 C 330 240, 260 60, 590 60 C 920 60, 850 240, 1100 240"/>
        <path id="senna-skid" d="M 500 96 C 560 88, 640 96, 700 130" fill="none" stroke="#ffdf00" stroke-width="7" stroke-linecap="round" opacity="0"/>
        <circle class="spark s1" cx="590" cy="30" r="6" fill="#ffd34d" opacity="0"/>
        <circle class="spark s2" cx="560" cy="26" r="4.5" fill="#ffefbc" opacity="0"/>
        <circle class="spark s3" cx="622" cy="34" r="5" fill="#ffd34d" opacity="0"/>
        <g id="senna-ant" transform="translate(80,240)">
          <circle r="30" fill="#17171b" stroke="#27f4d2" stroke-width="4"/>
          <text y="7" text-anchor="middle" font-family="Anton, 'Archivo Black', sans-serif" font-style="italic" font-size="19" fill="#27f4d2">ANT</text>
        </g>
        <g id="senna-nor" transform="translate(80,300)" opacity="0">
          <circle r="30" fill="#17171b" stroke="#ff8000" stroke-width="4"/>
          <text y="7" text-anchor="middle" font-family="Anton, 'Archivo Black', sans-serif" font-style="italic" font-size="19" fill="#ff8000">NOR</text>
        </g>
      </svg>

      <div class="caption" id="senna-cap-spin" style="opacity:0">Antonelli spins across the gravel</div>
      <div class="caption" id="senna-cap-lead" style="opacity:0">Norris sweeps through — takes the lead</div>
      <div class="sub" id="senna-sub">The corner at Turn 1 — Autódromo José Carlos Pace</div>
    </div>
    <audio id="senna-vo" data-start="0.5" data-duration="6.43" data-track-index="9" data-playback-rate="1.15" src="./assets/voice/p5.mp3"></audio>
  </div>
  <script>
    const path = document.getElementById("senna-path");
    const ant = document.getElementById("senna-ant");
    const nor = document.getElementById("senna-nor");
    const len = path.getTotalLength();
    const place = (el, t) => { const p = path.getPointAtLength(len * t); el.setAttribute("transform", "translate(" + p.x + "," + p.y + ")"); };
    const antTravel = { t: 0 };
    const norTravel = { t: 0.3 };

    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#senna-kicker", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.15);
    tl.fromTo(".lap-num", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, 0.3);
    tl.fromTo("#senna-sub", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.6);

    // 1) champion leads for 19 laps — ANT pushes to the apex (halfway)
    tl.to(antTravel, { t: 0.5, duration: 2.2, ease: "power1.inOut", onUpdate: () => place(ant, antTravel.t) }, 1.0);

    // 2) lap 20 — the spin at the Senna S
    tl.to("#senna-ant", { rotation: 580, transformOrigin: "50% 50%", duration: 1.15, ease: "power2.out" }, 3.25);
    tl.to("#senna-ant", { y: 88, x: -34, scale: 1.18, opacity: 0.78, duration: 0.9, ease: "power2.out" }, 3.25);
    [".s1", ".s2", ".s3"].forEach((sel, i) => {
      tl.fromTo(sel, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1.6, duration: 0.32, yoyo: true, repeat: 1, ease: "power2.out" }, 3.35 + i * 0.12);
    });
    tl.fromTo("#senna-skid", { opacity: 0 }, { opacity: 0.9, duration: 0.3 }, 3.3);
    tl.fromTo("#senna-cap-spin", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 3.7);

    // 3) Norris sweeps by into the lead
    tl.set("#senna-nor", { opacity: 1 }, 4.35);
    place(nor, norTravel.t);
    tl.to(norTravel, { t: 1.0, duration: 2.3, ease: "power1.inOut", onUpdate: () => place(nor, norTravel.t) }, 4.4);
    tl.to("#senna-cap-spin", { opacity: 0, y: -10, duration: 0.3 }, 5.05);
    tl.fromTo("#senna-cap-lead", { opacity: 0, y: 14, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 5.15);
    window.__timelines["senna"] = tl;
  </script>
</template>
